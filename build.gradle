// Top-level build file. Configuration common to all sub-projects/modules.
//
// Arena AI is a single-module Android app: a native WebView session that is
// owned by a foreground service (see app/src/main/java/com/federal/arenaai).

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'

        // NOTE: Do not place application dependencies here; they belong in the
        // individual module build.gradle files (app/build.gradle).
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
