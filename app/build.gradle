plugins {
    id 'com.android.application'
}

// -----------------------------------------------------------------------------
// Single source of truth for the site this app wraps.
//
// These values are exposed to Java through BuildConfig and to the manifest
// through manifest placeholders, so the host never has to be repeated (and can
// never drift) between Gradle, the manifest and the Java sources.
// -----------------------------------------------------------------------------
def arenaHost = 'arena.ai'
def arenaStartUrl = 'https://arena.ai/'

// -----------------------------------------------------------------------------
// Release signing configuration.
//
// Signing credentials are read from `keystore.properties` at the project root.
// That file is NEVER committed to the repository (see .gitignore). In CI it is
// generated from GitHub Secrets when they are configured (see the workflow in
// .github/workflows/build-apk.yml).
//
// If no `keystore.properties` file is present, the release build falls back to
// signing with the Android debug key so that the produced APK is still
// installable on a device for development and testing. This is NOT suitable for
// publishing to the Play Store — configure real signing keys for that (see
// README.md).
// -----------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseSigning = keystoreProperties['storeFile'] != null &&
            rootProject.file(keystoreProperties['storeFile'] as String).exists()
    if (!hasReleaseSigning) {
        logger.warn('keystore.properties found but storeFile is missing/unreadable — ' +
                'falling back to debug signing for the release build.')
    }
}

android {
    namespace 'com.federal.arenaai'

    // Android 16. Google Play requires new apps and app updates to target
    // API 36 from 2026-08-31 onwards, so both compile and target SDK are 36.
    compileSdk 36

    defaultConfig {
        applicationId 'com.federal.arenaai'

        // API 24 (Android 7.0). The app relies on modern WebView/WebKit
        // behaviour and on runtime-permission APIs; API 24 still covers
        // ~97% of active Android devices.
        minSdk 24
        targetSdk 36

        versionCode 2
        versionName '2.0.0'

        buildConfigField 'String', 'ARENA_HOST', "\"${arenaHost}\""
        buildConfigField 'String', 'ARENA_START_URL', "\"${arenaStartUrl}\""

        // Used by the (non-autoVerify) VIEW intent-filter in AndroidManifest.xml.
        manifestPlaceholders = [arenaHost: arenaHost]
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword'] as String
                keyAlias keystoreProperties['keyAlias'] as String
                keyPassword keystoreProperties['keyPassword'] as String
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
        }
    }

    lint {
        // Never fail CI on lint; the build job's purpose is to produce an APK.
        abortOnError false
        checkReleaseBuilds true
    }

    testOptions {
        unitTests {
            // UrlPolicyTest reads BuildConfig.ARENA_HOST, which is a real generated constant.
            // Any *other* Android framework call in a unit test should fail loudly rather than
            // silently return 0/null, so default-return-mocks stays off.
            returnDefaultValues = false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Android 12+ style splash screen, back-ported to API 24.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // ActivityResult APIs (file chooser, runtime permissions) + OnBackPressedDispatcher.
    implementation 'androidx.activity:activity:1.9.3'
    // Feature-detected modern WebView settings (algorithmic darkening, Safe Browsing).
    implementation 'androidx.webkit:webkit:1.12.1'

    // JVM unit tests for the framework-free URL policy. Run with: ./gradlew testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}
