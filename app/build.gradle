plugins {
    id 'com.android.application'
}

// -----------------------------------------------------------------------------
// Release signing configuration.
//
// Signing credentials are read from `keystore.properties` at the project root.
// That file is NEVER committed to the repository (see .gitignore). In CI it is
// generated from GitHub Secrets when they are configured (see the workflow in
// .github/workflows/build-apk.yml).
//
// If no `keystore.properties` file is present, the release build falls back to
// signing with the Android debug key so that the produced APK is still
// installable on a device for development and testing. This is NOT suitable for
// publishing to the Play Store — configure real signing keys for that (see
// README.md).
// -----------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseSigning = keystoreProperties.storeFile != null
}

android {
    // Google Play requires new apps/updates to target Android 16 (API 36) starting
    // 2026-08-31 (with existing published apps required to target at least API 35 to
    // remain visible to new users on newer devices). compileSdk/targetSdk are therefore
    // pinned to 36 so this app stays publishable. See README.md, section "Target/compile
    // SDK" for the full rationale.
    compileSdkVersion 36
    namespace "com.federal.arenaai"

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.federal.arenaai"
        // A foreground service kept alive by the app is only meaningful on API levels
        // that support android.app.Service#startForeground with a notification, which is
        // effectively all supported Android versions. minSdk 24 (Android 7.0) is kept as a
        // sane, still-broad floor; it also matches the minimum version that reliably
        // supports the modern android.webkit.WebView feature set (Safe Browsing,
        // WebViewClient#onReceivedError(WebResourceRequest, WebResourceError), etc.).
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 2
        versionName "2.0.0"

        resValue "string", "appName", "Arena AI"
        resValue "string", "launcherName", "Arena AI"
        resValue "string", "launchUrl", "https://arena.ai/"
        resValue "string", "hostName", "arena.ai"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            // The debug build is not minified so it stays easy to attach a debugger to the
            // Activity/Service and inspect the WebView with chrome://inspect.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        checkReleaseBuilds false
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
}
