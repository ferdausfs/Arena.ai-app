plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseSigning = keystoreProperties.storeFile != null
}

android {
    namespace "com.federal.arenaai"
    // 35: GeckoView (139+) requires compileSdk >= 35; targetSdk stays 34.
    compileSdk 35

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.federal.arenaai"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The GeckoView (Firefox) engine is only bundled for the two ABIs that
        // cover virtually all phones; keeps the prototype APK ~2x smaller.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // MediaStore / notification APIs are version-gated in code; don't let
    // lintVitalRelease fail assembleRelease on false-positive NewApi hits.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // GeckoView loads its native libraries from the APK (extract them at
    // install time) — required by the GeckoView docs.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    // Chrome Custom Tabs — required for Google OAuth (Google blocks embedded WebView)
    // See https://developers.googleblog.com/2016/08/modernizing-oauth-interactions-in-native-apps.html
    implementation 'androidx.browser:browser:1.8.0'

    // Prototype: bundled Firefox engine (no system WebView/Chrome dependency).
    // Resolved from https://maven.mozilla.org/maven2/ (added in root build.gradle).
    // Pin 124: it depends on kotlin-stdlib 1.8.x (compatible with this project's
    // Kotlin 1.9.22); newer GeckoView (139+) pulls kotlin-stdlib 2.1.x which the
    // 1.9.22 compiler cannot read.
    implementation 'org.mozilla.geckoview:geckoview:124.0.20240401114208'
}
