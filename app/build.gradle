plugins {
    id 'com.android.application'
}

// -----------------------------------------------------------------------------
// Release signing configuration.
//
// Signing credentials are read from `keystore.properties` at the project root.
// That file is NEVER committed to the repository (see .gitignore). In CI it is
// generated from GitHub Secrets when they are configured (see the workflow in
// .github/workflows/build-apk.yml).
//
// If no `keystore.properties` file is present, the release build falls back to
// signing with the Android debug key so that the produced APK is still
// installable on a device for development and testing. This is NOT suitable for
// publishing to the Play Store — configure real signing keys for that (see
// README.md).
// -----------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseSigning = keystoreProperties.storeFile != null
}

android {
    namespace "com.federal.arenaai"
    compileSdkVersion 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.federal.arenaai"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
