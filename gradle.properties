# Project-wide Gradle settings.
#
# IDE (e.g. Android Studio) users: Gradle settings configured through the IDE
# *will override* any settings specified in this file.
#
# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon. 2 GB is enough for this single-module
# project and keeps CI runners (and low-memory laptops) comfortable.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build caching / configuration on demand keep incremental builds fast.
org.gradle.caching=true

# AndroidX is required by every dependency this project uses.
android.useAndroidX=true

# Non-transitive R classes are the AGP 8 default; declared explicitly so the
# behaviour does not change if the default ever moves again.
android.nonTransitiveRClass=true
